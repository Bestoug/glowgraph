    </radialGradient>
    <clipPath id="form"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g clip-path="url(#form)">
    <rect x="100" y="100" width="824" height="824" fill="url(#grund)"/>
    <!-- Rauch -->
    <ellipse cx="420" cy="690" rx="330" ry="90" fill="#ffdcb4" opacity=".05"/>
    <ellipse cx="640" cy="330" rx="300" ry="70" fill="#ffdcb4" opacity=".04"/>
    <!-- Art-Deco-Rahmen -->
    <rect x="148" y="148" width="728" height="728" rx="150" fill="none" stroke="#be804a" stroke-opacity=".55" stroke-width="5"/>
    <rect x="166" y="166" width="692" height="692" rx="134" fill="none" stroke="#be804a" stroke-opacity=".25" stroke-width="2"/>
    <!-- Netz: Bögen wie in der Laterne -->
    <g fill="none" stroke="#be804a" stroke-opacity=".55" stroke-width="3.2" stroke-linecap="round">
      <path d="M512 512 Q 400 400 300 360"/><path d="M512 512 Q 640 400 730 360"/>
      <path d="M512 512 Q 430 640 330 690"/><path d="M512 512 Q 600 650 700 690"/>
      <path d="M300 360 Q 300 520 330 690"/><path d="M730 360 Q 730 520 700 690"/>
      <path d="M300 360 Q 512 250 730 360"/><path d="M330 690 Q 512 790 700 690"/>
