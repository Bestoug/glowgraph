    <!-- Laterne: Sechseck um das Licht -->
    <circle cx="512" cy="512" r="300" fill="url(#licht)"/>
    <polygon points="512,402 607,457 607,567 512,622 417,567 417,457" fill="none" stroke="#f5d39a" stroke-opacity=".85" stroke-width="5"/>
    <polygon points="512,432 581,472 581,552 512,592 443,552 443,472" fill="none" stroke="#f5d39a" stroke-opacity=".35" stroke-width="2.5"/>
    <circle cx="512" cy="512" r="30" fill="#fff6e6"/>
    <!-- Notizen -->
    <circle cx="300" cy="360" r="70" fill="url(#punkt)"/><circle cx="300" cy="360" r="12" fill="#fff6e6"/>
    <circle cx="730" cy="360" r="70" fill="url(#punkt)"/><circle cx="730" cy="360" r="12" fill="#fff6e6"/>
    <circle cx="330" cy="690" r="64" fill="url(#petrol)"/><circle cx="330" cy="690" r="11" fill="#e6fff8"/>
    <circle cx="700" cy="690" r="64" fill="url(#petrol)"/><circle cx="700" cy="690" r="11" fill="#e6fff8"/>
    <circle cx="512" cy="262" r="46" fill="url(#punkt)"/><circle cx="512" cy="262" r="8" fill="#fff6e6"/>
    <circle cx="512" cy="776" r="46" fill="url(#punkt)"/><circle cx="512" cy="776" r="8" fill="#fff6e6"/>
