<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="grund" cx="50%" cy="46%" r="70%">
      <stop offset="0" stop-color="#2a1c10"/><stop offset=".6" stop-color="#120c08"/><stop offset="1" stop-color="#050302"/>
    </radialGradient>
    <radialGradient id="licht" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff1d6" stop-opacity="1"/><stop offset=".14" stop-color="#ffd08a" stop-opacity=".75"/>
      <stop offset=".4" stop-color="#ff9a3c" stop-opacity=".22"/><stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="punkt" cx="50%" cy="50%" r="50%">
